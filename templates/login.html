<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Coca-Cola Logística</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Animate CSS para las animaciones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        body {
            /* Añadimos un filtro oscuro sobre la imagen para resaltar la tarjeta de login */
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                              url('https://images.unsplash.com/photo-1586528116311-ad8ed7abe0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        .hover-shadow {
            transition: all 0.3s ease;
        }
        .hover-shadow:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-lg border-0 animate__animated animate__fadeInUp" style="width: 100%; max-width: 420px; border-radius: 15px;">
        
        <!-- Cabecera de la Tarjeta (Tema Rojo) -->
        <div class="card-header bg-danger text-white text-center py-4" style="border-top-left-radius: 15px; border-top-right-radius: 15px;">
            <h4 class="mb-0 fw-bold"><i class="bi bi-person-circle me-2"></i>Acceso al Sistema</h4>
        </div>
        
        <div class="card-body p-4 p-md-5">
            <!-- Alerta de Errores de Django -->
            {% if form.errors %}
                <div class="alert alert-danger shadow-sm mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                
                <!-- Campo Usuario -->
                <div class="mb-3">
                    <label for="id_username" class="form-label text-muted fw-semibold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-danger"><i class="bi bi-person-fill"></i></span>
                        <input type="text" name="username" class="form-control form-control-lg" id="id_username" placeholder="Ingresa tu usuario" required autofocus>
                    </div>
                </div>
                
                <!-- Campo Contraseña -->
                <div class="mb-4">
                    <label for="id_password" class="form-label text-muted fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-danger"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="password" class="form-control form-control-lg" id="id_password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>
                
                <!-- Botón de Ingreso -->
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-danger btn-lg fw-bold hover-shadow">
                        Ingresar al Dashboard
                    </button>
                </div>
            </form>
        </div>
    </div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
